name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install coding standards (CI only, not shipped with the plugin)
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction wp-coding-standards/wpcs:^3.1 phpcompatibility/phpcompatibility-wp:^2.1
      - name: Run PHPCS
        run: ~/.composer/vendor/bin/phpcs || ~/.config/composer/vendor/bin/phpcs

  integration:
    name: Integration (WP ${{ matrix.wp }}, PHP ${{ matrix.php }}${{ matrix.plugins && ', with plugins' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '6.2'
            php: '7.4'
            plugins: false
          - wp: 'latest'
            php: '8.3'
            plugins: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP: wp --path=${{ github.workspace }}/wordpress
      BMS3O_TEST_URL: http://localhost:8080
      BMS3O_TEST_ENDPOINT: http://127.0.0.1:9000
      BMS3O_TEST_BUCKET: wordpress
      BMS3O_TEST_KEY: minioadmin
      BMS3O_TEST_SECRET: minioadmin
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mysqli, zip
          coverage: none
          tools: wp-cli

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          MC="docker run --rm --network host -e MC_HOST_l=http://minioadmin:minioadmin@127.0.0.1:9000 -v ${{ github.workspace }}/plugin/tests/integration:/cfg cgr.dev/chainguard/minio-client:latest"
          $MC mb l/wordpress
          $MC anonymous set-json /cfg/public-policy.json l/wordpress

      - name: Install WordPress
        run: |
          $WP core download --version=${{ matrix.wp }}
          $WP config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1
          $WP config set WP_DEBUG true --raw
          $WP config set WP_DEBUG_LOG true --raw
          $WP config set WP_DEBUG_DISPLAY false --raw
          $WP core install --url="$BMS3O_TEST_URL" --title=Test --admin_user=admin --admin_password=admin --admin_email=admin@example.test --skip-email
          $WP rewrite structure '/%postname%/'
          ln -s "${{ github.workspace }}/plugin" "${{ github.workspace }}/wordpress/wp-content/plugins/bm-s3-offload"
          $WP plugin activate bm-s3-offload
          $WP eval-file plugin/tests/integration/setup.php

      - name: Install BuddyBoss Platform and WooCommerce
        if: matrix.plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R buddyboss/buddyboss-platform -p 'buddyboss-platform-*.zip' -D /tmp/bb
          $WP plugin install /tmp/bb/buddyboss-platform-*.zip --activate
          $WP eval-file plugin/tests/integration/setup-buddyboss.php
          $WP plugin install woocommerce --activate
          $WP rewrite flush

      - name: Install Polylang, Elementor, Enable Media Replace and EWWW Image Optimizer
        if: matrix.plugins
        run: |
          $WP plugin install polylang elementor enable-media-replace ewww-image-optimizer --activate
          $WP eval-file plugin/tests/integration/setup-plugins.php
          $WP rewrite flush

      - name: Start web server
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -S localhost:8080 -t wordpress plugin/tests/integration/router.php > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done

      - name: Run integration tests
        run: plugin/tests/integration/run.sh

      - name: Logs
        if: failure()
        run: |
          tail -n 100 wordpress/wp-content/debug.log || true
          tail -n 50 /tmp/server.log || true
