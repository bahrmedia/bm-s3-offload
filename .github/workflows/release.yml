name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin ZIP
        run: |
          mkdir -p build
          git archive --format=zip --prefix=bm-s3-offload/ -o build/bm-s3-offload.zip "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/bm-s3-offload.zip --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
